<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>长文本批量合成服务</title>
<link rel="stylesheet" href="/static/app.css?v=5">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">◈</span>
    <div>
      <h1>长文本批量合成</h1>
      <p class="sub">自动分块 · 顺序合并 · 手机可连</p>
    </div>
  </div>
  <div class="topbar-right">
    <div id="engineBadge" class="badge idle" title="推理引擎状态">
      <span class="dot"></span><span id="engineText">连接中…</span>
    </div>
    <a class="ghost-btn" href="/docs/mobile" target="_blank">手机端接入</a>
    <a class="ghost-btn" href="/docs" target="_blank">API 文档</a>
  </div>
</header>

<main class="layout">

  <!-- ============ 左：配置面板 ============ -->
  <aside class="panel config">

    <section class="block">
      <h2>1 · 文本文件</h2>
      <div id="dropzone" class="dropzone">
        <div class="dz-icon">⇪</div>
        <p><strong>拖拽 .txt 文件到这里</strong></p>
        <p class="hint">或 <button type="button" class="link-btn" id="pickFiles">点击选择</button> · 支持多选批量处理</p>
        <input type="file" id="fileInput" accept=".txt,.text,.md,.markdown" multiple hidden>
      </div>
      <ul id="fileList" class="file-list"></ul>
    </section>

    <section class="block">
      <h2>2 · 音色与情感</h2>
      <label class="field">
        <span>参考音色</span>
        <div class="row">
          <select id="voice"></select>
          <button type="button" class="mini-btn" id="uploadVoice">上传</button>
          <input type="file" id="voiceInput" accept="audio/*,.wav" hidden>
        </div>
      </label>

      <label class="field">
        <span>情感控制</span>
        <select id="emoMode">
          <option value="0">与音色保持一致（推荐）</option>
          <option value="1">情感参考音频</option>
          <option value="2">情感向量（手动调节）</option>
          <option value="3">情感文本描述</option>
        </select>
      </label>

      <div id="emoRefWrap" class="sub-field hidden">
        <label class="field">
          <span>情感参考音频</span>
          <input type="file" id="emoAudio" accept="audio/*,.wav">
        </label>
        <label class="field">
          <span>情感强度 <b id="emoWeightVal">0.65</b></span>
          <input type="range" id="emoWeight" min="0" max="1" step="0.01" value="0.65">
        </label>
      </div>

      <div id="emoVecWrap" class="sub-field hidden">
        <div class="emo-grid" id="emoGrid"></div>
        <label class="check"><input type="checkbox" id="emoRandom"> 随机抽取情感维度</label>
        <label class="field">
          <span>情感强度 <b id="emoWeightVal2">0.65</b></span>
          <input type="range" id="emoWeight2" min="0" max="1" step="0.01" value="0.65">
        </label>
      </div>

      <div id="emoTextWrap" class="sub-field hidden">
        <label class="field">
          <span>情感描述（留空则按正文自动判断）</span>
          <input type="text" id="emoText" placeholder="例如：激动、语速偏快">
        </label>
      </div>
    </section>

    <section class="block">
      <h2>3 · 分块设置</h2>
      <p class="note">长文本按句末标点自动切块，逐块合成，防止显存爆掉。</p>
      <div class="grid2">
        <label class="field">
          <span>目标块长（字）</span>
          <input type="number" id="chunkChars" value="500" min="100" max="4000" step="50">
        </label>
        <label class="field">
          <span>单块上限（字）</span>
          <input type="number" id="hardMaxChars" value="700" min="100" max="4000" step="50">
        </label>
      </div>
      <label class="field">
        <span>块间静音（毫秒）</span>
        <input type="number" id="gapMs" value="200" min="0" max="5000" step="50">
      </label>
      <button type="button" class="ghost-btn full" id="previewBtn">预览分块效果</button>
      <div id="previewBox" class="preview-box hidden"></div>
    </section>

    <section class="block">
      <h2>4 · 输出</h2>
      <div class="grid2">
        <label class="field">
          <span>音频格式</span>
          <select id="outputFormat">
            <option value="wav">WAV（无损，推荐）</option>
            <option value="mp3">MP3（体积小）</option>
            <option value="m4a">M4A / AAC</option>
          </select>
        </label>
        <label class="field">
          <span>另存到目录（可空）</span>
          <input type="text" id="exportDir" placeholder="D:\ audiobook">
        </label>
      </div>
    </section>

    <details class="block adv">
      <summary>高级生成参数</summary>
      <div class="grid2">
        <label class="field"><span>温度</span><input type="number" id="temperature" value="0.8" step="0.05" min="0.05" max="2"></label>
        <label class="field"><span>top_p</span><input type="number" id="topP" value="0.8" step="0.05" min="0.01" max="1"></label>
        <label class="field"><span>top_k</span><input type="number" id="topK" value="30" step="1" min="0" max="200"></label>
        <label class="field"><span>beam 数</span><input type="number" id="numBeams" value="3" step="1" min="1" max="10"></label>
        <label class="field"><span>重复惩罚</span><input type="number" id="repPenalty" value="10" step="0.5" min="1" max="100"></label>
        <label class="field"><span>段内 token 上限</span><input type="number" id="maxTokensSeg" value="120" step="10" min="20" max="600"></label>
      </div>
      <label class="check"><input type="checkbox" id="doSample" checked> 启用采样（取消则更稳定但更呆板）</label>
    </details>

    <div class="actions">
      <button id="startBtn" class="primary-btn">开始批量合成</button>
      <button id="cancelBtn" class="danger-btn hidden">取消任务</button>
    </div>
  </aside>

  <!-- ============ 右：任务与结果 ============ -->
  <section class="panel results">
    <div class="results-head">
      <h2>合成任务</h2>
      <div class="results-tools">
        <span id="queueInfo" class="muted"></span>
        <button class="ghost-btn hidden" id="clearFinishedBtn" title="从列表中移除已结束的任务，不删除磁盘上的音频文件">清理已完成 (0)</button>
        <button class="ghost-btn" id="clearTempBtn" title="删除所有分块临时缓存">清理临时缓存</button>
      </div>
    </div>
    <div id="taskList" class="task-list">
      <div class="empty" id="emptyState">
        <div class="empty-icon">♪</div>
        <p>还没有任务</p>
        <p class="hint">在左侧投入文本文件后点击「开始批量合成」</p>
      </div>
    </div>
  </section>
</main>

<audio id="player" controls preload="none"></audio>
<div id="toast" class="toast hidden"></div>

<!-- v=2：改过前端之后一定要手动 +1，否则浏览器会拿缓存里的旧文件，
     表现就是「代码明明改了但按钮没出现」。 -->
<script src="/static/app.js?v=5"></script>
</body>
</html>
